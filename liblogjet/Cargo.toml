[package]
name = "liblogjet"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
opentelemetry-proto = { version = "0.31", features = ["gen-tonic", "logs"] }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["transport"] }
