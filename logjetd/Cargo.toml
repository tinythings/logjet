[package]
name = "logjetd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
logjet = { path = ".." }
opentelemetry-proto = { version = "0.28", features = ["gen-tonic", "logs"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tiny_http = "0.12"
