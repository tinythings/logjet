[package]
name = "logjet"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = [
	".",
	"logjetd",
	"demo",
	"ljx",
	"liblogjet",
	"ljcel",
	"plugins/syslog-ingest",
	"plugins/logcat-ingest",
	"plugins/stress-ingest",
	"plugins/perfetto-ingest",
	"plugins/parquet-exporter",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"
default-members = [
	".",
	"logjetd",
	"demo",
	"ljx",
	"liblogjet",
	"ljcel",
	"plugins/syslog-ingest",
	"plugins/logcat-ingest",
	"plugins/stress-ingest",
	"plugins/perfetto-ingest",
	"plugins/parquet-exporter",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"
incremental = false

[dependencies]
crc32c = "0.6"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
arrow-array = "58.0.0"
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "logs"] }
parquet = { version = "58.0.0", default-features = false, features = ["arrow", "zstd"] }
prost = "0.14"
rand = "0.9.3"
