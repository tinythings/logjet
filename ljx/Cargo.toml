[package]
name = "ljx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
colored = "3"
crossterm = "0.28"
logjet = { path = ".." }
opentelemetry-proto = { version = "0.28", features = ["gen-tonic", "logs"] }
prost = "0.13"
ratatui = "0.29"
regex = "1.12"
shlex = "1.3"
