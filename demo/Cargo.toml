[package]
name = "otlp-demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
colored = "3"
logjet = { path = ".." }
opentelemetry-proto = { version = "0.28", features = ["gen-tonic", "logs"] }
prost = "0.13"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic = { version = "0.12", features = ["transport"] }
