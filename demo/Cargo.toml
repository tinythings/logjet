[package]
name = "otlp-demo"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
colored = "3"
logjet = { path = ".." }
opentelemetry-proto = { version = "0.31", features = ["gen-tonic", "logs"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
