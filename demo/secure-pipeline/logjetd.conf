output: file
file.path: ./logs
file.size: 16
file.name: secure.logjet
ingest.protocol: otlp-http
ingest.listen: 127.0.0.1:4319
ingest.tls-enable: true
ingest.cert-file: ./certs/ingest.pem
ingest.key-file: ./certs/ingest.key
replay.listen: 127.0.0.1:7002
replay.poll_ms: 50
collector.url: https://127.0.0.1:4321/v1/logs
collector.timeout-ms: 10000
collector.ca-file: ./certs/ca.pem
collector.server-name: collector.demo.logjet
